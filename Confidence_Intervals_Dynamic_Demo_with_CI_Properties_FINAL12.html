 tx(30,82,`Population: μ = ${fmt(mu)}, σ = ${fmt(sigma)}; confidence level = ${conf}%`,{"font-size":15,fill:"#555"});
 ln(x0,ym,x1,ym,{stroke:"#555","stroke-width":2,"stroke-dasharray":"9 7"});
 tx(x0+10,ym-12,"X̄ = μ",{"font-size":16,"font-weight":"700"});
 const up=[],lo=[];
 for(let n=2;n<=200;n++){let h=z*sigma/Math.sqrt(n);up.push([X(n),Y(mu+h)]);lo.push([X(n),Y(mu-h)]);}
 const P=pts=>pts.map((q,i)=>(i?"L":"M")+q[0]+","+q[1]).join(" ");
 const poly=up.concat(lo.slice().reverse()).map(q=>q.join(",")).join(" ");
 rr(x0,y0,x1-x0,y1-y0,{fill:"#fff",stroke:"none"});
 // Full two-sided CI band.
 add("polygon",{points:poly,fill:"#d9d9d9",opacity:.8});
 path(P(up),{fill:"none",stroke:"#222","stroke-width":3});
 path(P(lo),{fill:"none",stroke:"#222","stroke-width":3});
 ln(x0,y0,x0,y1,{stroke:"#222"}); ln(x0,y1,x1,y1,{stroke:"#222"});
 [-4,-2,0,2,4].forEach(d=>{let yy=Y(mu+d);ln(x0-6,yy,x0,yy,{stroke:"#222"});tx(x0-12,yy+5,d===0?"μ":(d>0?"+":"")+d,{"font-size":12,"text-anchor":"end"})});
 [2,5,10,25,50,100,200].forEach(n=>{let xx=X(n);ln(xx,y1,xx,y1+7,{stroke:"#222"});tx(xx,y1+27,String(n),{"font-size":12,"text-anchor":"middle"})});
 tx((x0+x1)/2,y1+52,"Sample size n",{"font-size":15,"text-anchor":"middle"});
 tx(28,(y0+y1)/2,"Estimate relative to μ",{"font-size":14,"text-anchor":"middle",transform:`rotate(-90 28 ${(y0+y1)/2})`});
 tx(x1-5,up[up.length-1][1]-10,"Upper CI limit",{"font-size":13,"text-anchor":"end"});
 tx(x1-5,lo[lo.length-1][1]+18,"Lower CI limit",{"font-size":13,"text-anchor":"end"});
 tx(x0,y0-18,`CI = X̄ ± ${z.toFixed(3)} × ${fmt(sigma)} / √n`,{"font-size":14});
}

function draw(){
 if(tab==="properties"){
  drawProperties();
  $("standardControls").style.display="none";
  $("propertiesControls").style.display="block";
  $("coverage").style.display="none";
  $("propClLabel").textContent=Math.round(+$("propCl").value)+"%";
  return;
 }
 $("standardControls").style.display="block";
 $("propertiesControls").style.display="none";
 $("coverage").style.display="block";
 let p=P();clear();drawPop(p);drawSampling(p);drawRows(p);$("clLabel").textContent=Math.round(p.cl*100)+"%";let I=info(),target=I.kind==="mean"?p.mu:p.sig*p.sig,hits=history.filter(r=>{let z=intervalFor(r,p);return z.lo<=target&&target<=z.hi}).length;$("coverage").textContent=history.length?Math.round(100*hits/history.length)+"%":"—";$("coverageText").textContent=`${hits} of ${history.length} intervals captured the true value`;$("note").innerHTML=I.kind==="mean"?(I.m==="Z"?"<b>Known σ:</b> the fixed dotted boundaries show the Z critical limits. A sample mean outside them produces a CI that misses the true mean.":"<b>Unknown σ:</b> the dotted boundaries show the t critical limits. Because the t distribution has heavier tails, these limits are wider than the corresponding Z limits, so misses are less frequent—but they can still occur."):"<b>Variance:</b> the interval uses the chi-square distribution. It is asymmetric because the chi-square distribution is asymmetric, and is exact under a normal-population assumption.";$("formula").innerHTML=I.kind==="mean"?(I.m==="Z"?"<b>Z CI:</b> sample mean ± z* × σ/√n":"<b>t CI:</b> sample mean ± t* × s/√n, df = n − 1"):"<b>Variance CI:</b> [(n − 1)s² / χ²<sub>upper</sub>, (n − 1)s² / χ²<sub>lower</sub>]"}
function take(){let p=P(),I=info(),rec;
if(I.kind==="mean"){
  let a=sample(p.shape,p.mu,p.sig,p.n),m=mean(a),s=Math.sqrt(v(a));
  rec={id:++seq,est:m,s2:s*s,kind:"mean",nAtSample:p.n};
}else{
  let a=sample(p.shape,p.mu,p.sig,p.n),s2=v(a);rec={id:++seq,est:s2,s2:s2,kind:"var",nAtSample:p.n};
}
history.push(rec); rows.push(rec); if(rows.length>20)rows.shift(); draw();
}
$("one").onclick=take;
function updatePauseButton(){
 const b=$("pauseSampling"); if(!b) return;
 b.textContent=pausedByTab[tab]?"Resume Sampling":"Pause Sampling";
 b.disabled=(!timer && !pausedByTab[tab]);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 clearInterval(timer); timer=null;
 saveState();
 tab=b.dataset.tab;
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));
 if(tab!=="properties") loadState(tab);
 updatePauseButton();
 draw();
});
["shape","mu","sigma","n","cl"].forEach(id=>$(id).addEventListener("input",()=>{
 if(tab!=="properties"){ rows=[]; history=[]; seq=0; saveState(); }
 draw();
}));
["propMu","propSigma","propCl"].forEach(id=>$(id).addEventListener("input",draw));
// A sampling run is one experimental cycle. Starting a new run begins a fresh
// cumulative record; stopping preserves that run's record. Starting again resets it.
$("start").onclick=()=>{
  if(tab==="properties") return;
  if(!timer){
    pausedByTab[tab]=false;
    resetCycle();
    take();
    timer=setInterval(take,1000);
    updatePauseButton();
  }
};
$("pauseSampling").onclick=()=>{
  if(tab==="properties") return;
  if(timer){
    clearInterval(timer); timer=null;
    pausedByTab[tab]=true;
  }else if(pausedByTab[tab]){
    // Resume the SAME sampling run. Nothing is reset.
    pausedByTab[tab]=false;
    take();
    timer=setInterval(take,1000);
  }
  updatePauseButton();
};
$("stop").onclick=()=>{
  clearInterval(timer); timer=null;
  pausedByTab[tab]=false;
  updatePauseButton();
};
$("clear").onclick=()=>{
  clearInterval(timer); timer=null;
  pausedByTab[tab]=false;
  resetCycle();
  updatePauseButton();
  draw();
};
draw();
updatePauseButton();
</script>
</body></html>
